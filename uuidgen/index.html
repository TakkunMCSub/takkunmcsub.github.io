<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UUID Generator</title>
<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

button{
padding:10px 20px;
margin:10px;
cursor:pointer;
}

input{
width:420px;
padding:10px;
}
</style>
</head>

<body>

<h1>UUID Generator</h1>

<select id="version">
<option value="v4">UUID v4</option>
<option value="v1">UUID v1</option>
<option value="v7">UUID v7</option>
<option value="guid">GUID</option>
</select>

<br><br>

<button onclick="generate()">Generate</button>

<br><br>

<input id="result" readonly>

<script>

function uuidv4(){
return crypto.randomUUID();
}

function uuidv1(){
return crypto.randomUUID();
}

function uuidv7(){
const t = Date.now().toString(16);
const r = crypto.getRandomValues(new Uint8Array(10));
return t + "-" + [...r].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function guid(){
return crypto.randomUUID().toUpperCase();
}

function generate(){

const type=document.getElementById("version").value;
let uuid="";

if(type==="v4") uuid=uuidv4();
if(type==="v1") uuid=uuidv1();
if(type==="v7") uuid=uuidv7();
if(type==="guid") uuid=guid();

document.getElementById("result").value=uuid;

}

</script>

</body>
</html>
