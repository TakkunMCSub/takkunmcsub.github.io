<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Utility Portal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Utility Portal</h1>
<p>Developer Tools</p>

<input id="search" placeholder="Search tools..." onkeyup="searchTools()">

</header>

<main class="tools" id="toolList">

<div class="card" data-name="uuid generator guid v1 v4 v7" onclick="openTool('uuidgen')">
<h2>UUID Generator</h2>
<p>V1 / V4 / V7 / GUID</p>
</div>

<div class="card" data-name="password generator security random" onclick="openTool('passwordgen')">
<h2>Password Generator</h2>
<p>Secure password creator</p>
</div>

</main>

<script src="script.js"></script>
</body>
</html>
